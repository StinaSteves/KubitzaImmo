<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-kubitza.png?v=5" />
    <link rel="shortcut icon" href="/favicon-kubitza.png?v=5" />
    <link rel="apple-touch-icon" href="/favicon-kubitza.png?v=5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kubitza Immobilien</title>
    <script>
      ;(() => {
        const redirectPath = new URLSearchParams(window.location.search).get('redirect')

        if (redirectPath) {
          const basePath = window.location.pathname.replace(/\/$/, '')
          window.history.replaceState(null, '', `${basePath}${redirectPath}`)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
