<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting</title>
    <script>
      ;(() => {
        const basePath = '/KubitzaImmo/'
        const path = window.location.pathname
        const route = path.startsWith(basePath)
          ? path.slice(basePath.length - 1)
          : path

        window.location.replace(
          `${basePath}?redirect=${encodeURIComponent(`${route}${window.location.search}${window.location.hash}`)}`,
        )
      })()
    </script>
  </head>
  <body></body>
</html>
